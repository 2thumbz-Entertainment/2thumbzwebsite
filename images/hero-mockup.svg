<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E86AB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B4F72;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Phone 1 -->
  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="80" height="160" rx="10" fill="url(#phoneGrad)" stroke="#5DADE2" stroke-width="2"/>
    <rect x="5" y="15" width="70" height="130" rx="5" fill="#F8F9FA"/>
    <circle cx="40" cy="8" r="3" fill="#5DADE2"/>
    <!-- App content -->
    <rect x="10" y="25" width="60" height="40" rx="3" fill="#5DADE2" opacity="0.3"/>
    <text x="40" y="50" font-family="Arial" font-size="8" fill="#1A1A1A" text-anchor="middle">EMOJI</text>
    <rect x="10" y="75" width="25" height="25" rx="3" fill="#5DADE2"/>
    <rect x="40" y="75" width="25" height="25" rx="3" fill="#3498DB"/>
    <rect x="10" y="105" width="25" height="25" rx="3" fill="#2E86AB"/>
    <rect x="40" y="105" width="25" height="25" rx="3" fill="#5DADE2"/>
  </g>

  <!-- Phone 2 (center, larger) -->
  <g transform="translate(150, 10)">
    <rect x="0" y="0" width="100" height="200" rx="12" fill="url(#phoneGrad)" stroke="#5DADE2" stroke-width="3"/>
    <rect x="5" y="18" width="90" height="165" rx="6" fill="#F8F9FA"/>
    <circle cx="50" cy="10" r="4" fill="#5DADE2"/>
    <!-- App content -->
    <rect x="10" y="28" width="80" height="50" rx="4" fill="#5DADE2" opacity="0.2"/>
    <text x="50" y="58" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1A1A1A" text-anchor="middle">COLLEGE</text>
    <text x="50" y="72" font-family="Arial, sans-serif" font-size="10" fill="#5DADE2" text-anchor="middle">CONTENT</text>
    <rect x="10" y="90" width="35" height="35" rx="4" fill="#5DADE2"/>
    <rect x="50" y="90" width="35" height="35" rx="4" fill="#3498DB"/>
    <rect x="10" y="130" width="35" height="35" rx="4" fill="#2E86AB"/>
    <rect x="50" y="130" width="35" height="35" rx="4" fill="#1B4F72"/>
  </g>

  <!-- Phone 3 -->
  <g transform="translate(270, 30)">
    <rect x="0" y="0" width="80" height="160" rx="10" fill="url(#phoneGrad)" stroke="#5DADE2" stroke-width="2"/>
    <rect x="5" y="15" width="70" height="130" rx="5" fill="#F8F9FA"/>
    <circle cx="40" cy="8" r="3" fill="#5DADE2"/>
    <!-- App content -->
    <rect x="10" y="25" width="60" height="40" rx="3" fill="#3498DB" opacity="0.3"/>
    <text x="40" y="50" font-family="Arial" font-size="8" fill="#1A1A1A" text-anchor="middle">STICKERS</text>
    <circle cx="25" cy="90" r="12" fill="#5DADE2"/>
    <circle cx="50" cy="90" r="12" fill="#3498DB"/>
    <circle cx="25" cy="118" r="12" fill="#2E86AB"/>
    <circle cx="50" cy="118" r="12" fill="#5DADE2"/>
  </g>

  <!-- Floating elements -->
  <circle cx="30" cy="250" r="15" fill="#5DADE2" opacity="0.5"/>
  <circle cx="370" cy="260" r="20" fill="#3498DB" opacity="0.4"/>
  <rect x="320" cy="40" width="30" height="30" rx="5" fill="#5DADE2" opacity="0.3" transform="rotate(15 335 55)"/>
</svg>
