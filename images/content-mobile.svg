<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <rect width="300" height="200" fill="#F8F9FA"/>

  <!-- Phone outline -->
  <rect x="100" y="20" width="100" height="160" rx="12" fill="#2E86AB" stroke="#5DADE2" stroke-width="2"/>
  <rect x="105" y="35" width="90" height="130" rx="6" fill="white"/>

  <!-- Screen content -->
  <rect x="115" y="45" width="70" height="40" rx="4" fill="#5DADE2" opacity="0.3"/>
  <text x="150" y="70" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1A1A1A" text-anchor="middle">MOBILE APPS</text>

  <!-- Grid of emojis/stickers -->
  <rect x="115" y="95" width="30" height="30" rx="4" fill="#5DADE2"/>
  <rect x="150" y="95" width="30" height="30" rx="4" fill="#3498DB"/>
  <rect x="115" y="130" width="30" height="30" rx="4" fill="#2E86AB"/>
  <rect x="150" y="130" width="30" height="30" rx="4" fill="#5DADE2"/>

  <!-- Decorative elements -->
  <circle cx="50" cy="100" r="25" fill="#5DADE2" opacity="0.2"/>
  <circle cx="250" cy="100" r="25" fill="#3498DB" opacity="0.2"/>
</svg>
