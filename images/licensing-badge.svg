<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Circle badge -->
  <circle cx="50" cy="50" r="45" fill="#2E86AB" stroke="#5DADE2" stroke-width="2"/>
  <circle cx="50" cy="50" r="38" fill="white"/>

  <!-- Check mark -->
  <path d="M30 50 L45 65 L70 35" fill="none" stroke="#5DADE2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Text arc - top -->
  <text font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#2E86AB">
    <textPath href="#topArc">OFFICIALLY</textPath>
  </text>

  <!-- Text arc - bottom -->
  <text font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#2E86AB">
    <textPath href="#bottomArc">LICENSED</textPath>
  </text>

  <defs>
    <path id="topArc" d="M20 50 A30 30 0 0 1 80 50" fill="none"/>
    <path id="bottomArc" d="M25 65 A30 30 0 0 0 75 65" fill="none"/>
  </defs>
</svg>
