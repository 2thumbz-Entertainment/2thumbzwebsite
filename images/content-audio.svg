<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <rect width="300" height="200" fill="#F8F9FA"/>

  <!-- Speaker/sound icon -->
  <path d="M100 70 L100 130 L130 130 L170 160 L170 40 L130 70 Z" fill="#2E86AB" stroke="#5DADE2" stroke-width="2"/>

  <!-- Sound waves -->
