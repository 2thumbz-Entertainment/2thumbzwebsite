  <rect x="66" y="30" width="3" height="30" fill="#5DADE2"/>
  <path d="M69 30 Q85 25 85 40" fill="none" stroke="#5DADE2" stroke-width="3"/>

  <circle cx="250" cy="140" r="6" fill="#3498DB"/>
