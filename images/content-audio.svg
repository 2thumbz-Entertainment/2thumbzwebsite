  <path d="M200 65 Q225 100 200 135" fill="none" stroke="#5DADE2" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M215 50 Q250 100 215 150" fill="none" stroke="#5DADE2" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Music notes -->
